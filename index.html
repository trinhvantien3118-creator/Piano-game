
<!DOCTYPE html>
<html>
<head>
    <title>Piano Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eeeeee;
        }

        .keyboard-viewport {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .keyboard {
            display: flex;
            width: max-content;
            margin: 0 auto;
        }

        .white-key {
            width: 45px;
            height: 288px;
            flex: 0 0 45px;

            padding: 0 0 14px;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            background-color: white;
            color: black;

            border: 1px solid black;
            border-right: 0;
            border-radius: 0 0 4px 4px;

            font-size: 15px;
            font-family: Arial, sans-serif;

            cursor: pointer;

            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        .white-key:last-child {
            border-right: 1px solid black;
        }

        .white-key.is-pressed {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <div class="keyboard-viewport">
        <div class="keyboard">

            <button class="white-key"
                onpointerdown="playNote(event, 'C5')"
                onpointerup="stopNote(event)"
                onpointercancel="stopNote(event)"
                onlostpointercapture="stopNote(event)">
                C5
            </button>

            <button class="white-key"
                onpointerdown="playNote(event, 'D5')"
                onpointerup="stopNote(event)"
                onpointercancel="stopNote(event)"
                onlostpointercapture="stopNote(event)">
                D5
            </button>

            <button class="white-key"
                onpointerdown="playNote(event, 'E5')"
                onpointerup="stopNote(event)"
                onpointercancel="stopNote(event)"
                onlostpointercapture="stopNote(event)">
                E5
            </button>

            <button class="white-key"
                onpointerdown="playNote(event, 'F5')"
                onpointerup="stopNote(event)"
                onpointercancel="stopNote(event)"
                onlostpointercapture="stopNote(event)">
                F5
            </button>

            <button class="white-key"
                onpointerdown="playNote(event, 'G5')"
                onpointerup="stopNote(event)"
                onpointercancel="stopNote(event)"
                onlostpointercapture="stopNote(event)">
                G5
            </button>

            <button class="white-key"
                onpointerdown="playNote(event, 'A5')"
                onpointerup="stopNote(event)"
                onpointercancel="stopNote(event)"
                onlostpointercapture="stopNote(event)">
                A5
            </button>

            <button class="white-key"
                onpointerdown="playNote(event, 'B5')"
                onpointerup="stopNote(event)"
                onpointercancel="stopNote(event)"
                onlostpointercapture="stopNote(event)">
                B5
            </button>

        </div>
    </div>

    <script>
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        const audioContext = new AudioContextClass({
            latencyHint: "interactive"
        });

        const notes = {
            C5: "C5-Piano.mp3",
            D5: "D5-Piano.mp3",
            E5: "E5-Piano.mp3",
            F5: "F5-Piano.mp3",
            G5: "G5-Piano.mp3",
            A5: "A5-Piano.mp3",
            B5: "B5-Piano.mp3"
        };

        const noteLoading = {};

        const activePresses = new Map();

        // Tải và giải mã toàn bộ âm thanh
        for (const [note, file] of Object.entries(notes)) {

            noteLoading[note] = fetch(file)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Audio not found");
                    }

                    return response.arrayBuffer();
                })
                .then(data => {
                    return audioContext.decodeAudioData(data);
                })
                .catch(() => null);

        }

        // Phát nốt nhạc
        function playNote(event, note) {

            event.preventDefault();

            const key = event.currentTarget;

            key.setPointerCapture(event.pointerId);

            key.classList.add("is-pressed");

            const press = {
                key: key,
                source: null,
                released: false
            };

            activePresses.set(event.pointerId, press);

            // Kích hoạt AudioContext khi có tương tác
            if (audioContext.state !== "running") {
                audioContext.resume().catch(() => {});
            }

            // Chờ âm thanh được giải mã
            noteLoading[note].then(buffer => {

                if (!buffer || press.released) {
                    return;
                }

                // Tạo nguồn phát mới cho mỗi lần nhấn
                const source = audioContext.createBufferSource();

                source.buffer = buffer;

                source.connect(audioContext.destination);

                press.source = source;

                source.start(0);

            });

        }

        // Dừng nốt nhạc
        function stopNote(event) {

            const press = activePresses.get(event.pointerId);

            if (!press) {
                return;
            }

            press.released = true;

            // Dừng âm thanh của lần nhấn này
            if (press.source) {

                try {
                    press.source.stop();
                } catch (error) {}

                press.source.disconnect();

            }

            activePresses.delete(event.pointerId);

            // Chỉ đổi màu về trắng khi không còn ngón tay giữ phím
            let stillPressed = false;

            for (const item of activePresses.values()) {
                if (item.key === press.key) {
                    stillPressed = true;
                    break;
                }
            }

            if (!stillPressed) {
                press.key.classList.remove("is-pressed");
            }

        }
    </script>

</body>
</html>
