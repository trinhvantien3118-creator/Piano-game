
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Piano Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eeeeee;
        }

        .keyboard-viewport {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .keyboard {
            position: relative;
            display: flex;

            width: 315px;
            height: 288px;

            margin-left: max(0px, calc((100% - 315px) / 2));
        }

        .piano-key {
            margin: 0;
            padding: 0;

            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        /* PHÍM TRẮNG */

        .white-key {
            position: relative;
            z-index: 1;

            width: 45px;
            height: 288px;
            flex: 0 0 45px;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            padding-bottom: 14px;

            background-color: white;
            color: black;

            border: 1px solid black;
            border-right: 0;
            border-radius: 0 0 4px 4px;

            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        .white-key:last-of-type {
            border-right: 1px solid black;
        }

        .white-key.is-pressed {
            background-color: lightblue;
        }

        /* PHÍM ĐEN */

        .black-key {
            position: absolute;
            z-index: 2;

            top: 0;

            width: 27px;
            height: 180px;

            background-color: #171717;

            border: 2px solid #050505;
            border-radius: 0 0 4px 4px;
        }

        .black-key.is-pressed {
            background-color: #555555;
        }

        /* VỊ TRÍ CÁC PHÍM ĐEN */

        .black-key[data-note="Cs5"] {
            left: 31.5px;
        }

        .black-key[data-note="Ds5"] {
            left: 76.5px;
        }

        .black-key[data-note="Fs5"] {
            left: 166.5px;
        }

        .black-key[data-note="Gs5"] {
            left: 211.5px;
        }

        .black-key[data-note="As5"] {
            left: 256.5px;
        }

    </style>
</head>

<body>

    <div class="keyboard-viewport">

        <div class="keyboard">

            <!-- PHÍM TRẮNG -->

            <button class="piano-key white-key" data-note="C5">C5</button>

            <button class="piano-key white-key" data-note="D5">D5</button>

            <button class="piano-key white-key" data-note="E5">E5</button>

            <button class="piano-key white-key" data-note="F5">F5</button>

            <button class="piano-key white-key" data-note="G5">G5</button>

            <button class="piano-key white-key" data-note="A5">A5</button>

            <button class="piano-key white-key" data-note="B5">B5</button>


            <!-- PHÍM ĐEN -->

            <button class="piano-key black-key" data-note="Cs5" aria-label="C sharp 5"></button>

            <button class="piano-key black-key" data-note="Ds5" aria-label="D sharp 5"></button>

            <button class="piano-key black-key" data-note="Fs5" aria-label="F sharp 5"></button>

            <button class="piano-key black-key" data-note="Gs5" aria-label="G sharp 5"></button>

            <button class="piano-key black-key" data-note="As5" aria-label="A sharp 5"></button>

        </div>

    </div>


    <script>

        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        const audioContext = new AudioContextClass({
            latencyHint: "interactive"
        });


        // DANH SÁCH FILE ÂM THANH

        const notes = {

            // PHÍM TRẮNG: FILE CÓ SẴN

            C5: "C5-Piano.mp3",
            D5: "D5-Piano.mp3",
            E5: "E5-Piano.mp3",
            F5: "F5-Piano.mp3",
            G5: "G5-Piano.mp3",
            A5: "A5-Piano.mp3",
            B5: "B5-Piano.mp3",


            // PHÍM ĐEN: MP3 TRỰC TIẾP

            Cs5: "https://cdn.jsdelivr.net/npm/tonejs-instrument-piano-mp3@1.1.2/Cs5.mp3",

            Ds5: "https://cdn.jsdelivr.net/npm/tonejs-instrument-piano-mp3@1.1.2/Ds5.mp3",

            Fs5: "https://cdn.jsdelivr.net/npm/tonejs-instrument-piano-mp3@1.1.2/Fs5.mp3",

            Gs5: "https://cdn.jsdelivr.net/npm/tonejs-instrument-piano-mp3@1.1.2/Gs5.mp3",

            As5: "https://cdn.jsdelivr.net/npm/tonejs-instrument-piano-mp3@1.1.2/As5.mp3"

        };


        const noteBuffers = {};

        const activePresses = new Map();


        // TẢI VÀ GIẢI MÃ ÂM THANH

        for (const [note, file] of Object.entries(notes)) {

            noteBuffers[note] = fetch(file)

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Audio not found");
                    }

                    return response.arrayBuffer();

                })

                .then(data => {

                    return audioContext.decodeAudioData(data);

                })

                .catch(() => null);

        }


        // PHÁT NỐT NHẠC

        function playNote(event) {

            event.preventDefault();

            const key = event.currentTarget;

            const note = key.dataset.note;

            key.setPointerCapture(event.pointerId);

            const press = {

                key: key,
                source: null,
                released: false

            };

            activePresses.set(event.pointerId, press);

            key.classList.add("is-pressed");


            // KÍCH HOẠT AUDIO

            const resumePromise = audioContext.state === "running"
                ? Promise.resolve()
                : audioContext.resume().catch(() => {});


            // ĐỢI ÂM THANH SẴN SÀNG

            noteBuffers[note].then(buffer => {

                if (!buffer || press.released) {
                    return;
                }

                resumePromise.then(() => {

                    if (press.released || audioContext.state !== "running") {
                        return;
                    }


                    // TẠO NGUỒN ÂM THANH MỚI

                    const source = audioContext.createBufferSource();

                    source.buffer = buffer;

                    source.connect(audioContext.destination);

                    press.source = source;

                    source.start(0);

                });

            });

        }


        // DỪNG NỐT NHẠC

        function stopNote(event) {

            const press = activePresses.get(event.pointerId);

            if (!press) {
                return;
            }

            press.released = true;


            // DỪNG NGUỒN ÂM THANH

            if (press.source) {

                try {

                    press.source.stop();

                } catch (error) {}

                press.source.disconnect();

                press.source = null;

            }


            activePresses.delete(event.pointerId);


            // KIỂM TRA CÒN NGÓN TAY GIỮ PHÍM KHÔNG

            let stillPressed = false;

            for (const item of activePresses.values()) {

                if (item.key === press.key) {

                    stillPressed = true;

                    break;

                }

            }

            if (!stillPressed) {

                press.key.classList.remove("is-pressed");

            }

        }


        // GẮN SỰ KIỆN CHO TOÀN BỘ PHÍM ĐÀN

        document.querySelectorAll(".piano-key").forEach(key => {

            key.addEventListener("pointerdown", playNote);

            key.addEventListener("pointerup", stopNote);

            key.addEventListener("pointercancel", stopNote);

            key.addEventListener("lostpointercapture", stopNote);

        });

    </script>

</body>
</html>
